  if(LA.stage!=='collect')return say(lang,'मैं टिकट, कनेक्टिंग ट्रेन, कुली-ऑटो, कमरा, यात्रा पैकेज और ट्रेन लेट होने में मदद कर सकता हूँ। क्या करना है?','Main ticket, connecting train, porter-auto, room, bundle aur delay mein madad kar sakta hoon. Kya karna hai?','I can help with tickets, connecting trains, porter and auto, rooms, trip bundles and delays. What would you like?')}
 if(npax()>6)return say(lang,'एक टिकट में 6 लोग ही हो सकते हैं। बड़े ग्रुप के लिए यात्रा सर्कल लिंक बनाऊँ?','Ek ticket mein 6 log hi ho sakte hain. Bade group ke liye Group booking link banaun?','One e-ticket holds 6 people. Shall I start a group booking for everyone?');
 LA.stage='collect';const miss=stepFill(lang);addAct('Form updated');LA.expect=miss[0]||null;
 const note=(joined||'')+((LA.notes&&LA.notes.length)?LA.notes.join(' ')+' ':'');LA.notes=[];
 if(miss.length)return note+askFor(miss,lang);
 LA.expect=null;return note+summaryLine(lang)+' '+say(lang,'ट्रेनें खोज रहा हूँ… ','Trains dhoondh raha hoon… ','Searching… ')+doLocalSearch(lang)}
function syncLocal(){const st=LA.state;if(S.from)st.from=S.from;if(S.to)st.to=S.to;if(S.date)st.date=S.date;if(S.cls)st.cls=S.cls;st.trav=[...S.sel];const mid=['pax','food','ins','cover','pay','confirming'].includes(LA.stage);LA.stage=S.booked?'booked':S.pick?(mid?LA.stage:(S.view==='pay'?'pay':S.view==='pax'?'pax':'offer')):'collect'}
function localTurn(text,hidden){const m=addMsg('a','…');const tn=m.firstChild;setTimeout(()=>{let r;try{r=localReply(text)}catch(e){r='माफ़ कीजिए, समझ नहीं पाया। दोबारा बताइए? (Sorry, please say that again.)'}tn.textContent=r;if(autoTTS&&r)speak(r,m.querySelector('.spk'));document.getElementById('msgs').scrollTop=1e9},60)}

/* ---------- Voice ---------- */
let rec=null,recOn=false,speechLang='hi-IN',autoTTS=false,micAsked=false;
function toggleLang(){speechLang=speechLang==='hi-IN'?'en-IN':'hi-IN';document.getElementById('langBtn').textContent=speechLang==='hi-IN'?'हिंदी':'English'}
function toggleTTS(){unlockTTS();autoTTS=!autoTTS;if(autoTTS)speak('ऑटो रीड चालू है।');document.getElementById('ttsBtn').textContent=autoTTS?'🔊 Auto-read on':'🔈 Auto-read off';if(!autoTTS)stopTTS();}
function micFallback(){recOn=false;document.getElementById('micBtn').classList.remove('rec');document.getElementById('chatIn').focus();
 addMsg('a','इस व्यू में माइक की अनुमति नहीं है। कीबोर्ड पर 🎤 दबाकर बोलिए — शब्द यहाँ लिख जाएँगे, फिर "भेजें" दबाइए।\n(Mic is blocked in this view: tap the 🎤 on your phone keyboard and speak.)')}
function toggleMic(){if(!micAsked&&!recOn){micAsked=true;askMic();return}startMic()}
function askMic(){const c=document.createElement('div');c.className='confirm';c.style.borderColor='var(--brand)';
 c.innerHTML=`<b>🎤 माइक की अनुमति दें? · Allow microphone?</b><div class="small">Saathi को बोलकर बताने के लिए माइक चाहिए। अगले कदम पर आपका ब्राउज़र अनुमति माँगेगा — "Allow" दबाइए।<br><span class="muted">Your browser will ask next: tap "Allow".</span></div><div class="row" style="gap:8px"><button class="btn" style="padding:10px">अनुमति दें · Allow</button><button class="btn ghost" style="padding:10px">अभी नहीं</button></div>`;
 const [y,n]=c.querySelectorAll('button');y.onclick=()=>{c.remove();startMic()};n.onclick=()=>{c.remove();micAsked=false};
 const box=document.getElementById('msgs');box.appendChild(c);box.scrollTop=box.scrollHeight}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(recOn&&rec){rec.stop();return}if(!SR){micFallback();return}
 try{rec=new SR();rec.lang=speechLang;rec.interimResults=true;rec.continuous=false}catch(e){micFallback();return}
 const inp=document.getElementById('chatIn'),btn=document.getElementById('micBtn');let fin='',got=false;
 rec.onstart=()=>{recOn=true;btn.classList.add('rec');inp.placeholder=speechLang==='hi-IN'?'सुन रहा हूँ… बोलिए':'Listening… speak now'};
 rec.onresult=e=>{got=true;let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)fin=t}inp.value=t};
 rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){rec.onend=null;micFallback()}};
 rec.onend=()=>{recOn=false;btn.classList.remove('rec');inp.placeholder='बोलिए या लिखिए… e.g. कटरा जाना है';const t=(fin||inp.value).trim();if(got&&t)sendChat(t)};
 try{rec.start()}catch(e){micFallback()}}

/* ---------- Boot ---------- */
function render(){document.getElementById('view').innerHTML=V[S.view]();document.body.classList.toggle('hasbar',S.view==='custom');document.body.classList.toggle('hasbar2',S.view==='pkg')}
try{if(localStorage.getItem('safar-large')==='1'){S.large=true;document.body.classList.add('large')}}catch(e){}
fetch('rail.json').then(r=>r.json()).then(d=>{RAIL.load(d);S.from=RAIL.find('delhi')[0];S.to=RAIL.find('katra')[0];render()})
 .catch(e=>{document.getElementById('view').innerHTML='<div class="card">Could not load the timetable. Please reload the page.</div>'});
</script>
